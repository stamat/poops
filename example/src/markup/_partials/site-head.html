<!DOCTYPE html>
<html lang="{{ page.lang or site.lang or 'en' }}">
<head>
  <meta charset="UTF-8">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description or page.excerpt or site.description }}">
  {% if page.robots %}<meta name="robots" content="{{ page.robots }}">{% endif %}
  {{ page | canonical(site) }}
  {{ page | og(site) }}
  {{ page | jsonld(site) }}
  <link rel="alternate" type="application/rss+xml" href="{{ site.url }}/changelog/feed.rss">
  {% googleFonts ["DM Sans", {name: "Poppins", weights: [700]}] %}
  <link rel="stylesheet" href="{{ relativePathPrefix }}css/styles.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/marked-github-alerts/styles.css">
</head>
<body class="bg-brownish">
