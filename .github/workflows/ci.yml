name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build example site
        run: npm run build

      # poops -b exits non-zero on compile failure, so the step above already
      # gates. These artifact checks add a Windows-specific guard: a path
      # regression can compile zero files while still exiting 0-ish, and the
      # separator greps catch backslashes leaking into emitted URLs.
      - name: Verify build output
        shell: bash
        run: |
          test -f example/dist/index.html
          test -f example/dist/sitemap.xml
          test -f example/dist/search-index.json
          ! grep -q '\\' example/dist/sitemap.xml
          ! grep -q '\\\\' example/dist/search-index.json

      # Browser-support gates on the emitted bundles: stylelint checks the CSS
      # against .browserslistrc, es-check confirms the JS parses at the esbuild
      # target. Both read example/dist, which is gitignored, so they can only
      # run after the build step.
      - name: Check browser compatibility
        shell: bash
        run: |
          npm run lint:css
          npm run lint:es
